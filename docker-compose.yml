services:
  uni-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uni-mcp
    restart: unless-stopped
    ports:
      - "${PORT:-3301}:3301"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3301
      - HOST=0.0.0.0
      - SERPER_API_KEY=${SERPER_API_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/net:/host/proc/net:ro
      - /sys/class/net:/host/sys/class/net:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mcp-network
      # Jika ingin satu network langsung dengan container n8n (akses via http://uni-mcp:3301/mcp),
      # uncomment baris di bawah dan sesuaikan dengan nama network docker n8n Anda:
      - n8n-server_default

networks:
  mcp-network:
    driver: bridge
  # Uncomment blok di bawah jika ingin join ke network n8n yang sudah ada:
  n8n-server_default:
     external: true
     name: n8n-server_default
